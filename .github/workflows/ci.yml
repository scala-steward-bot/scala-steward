on:
  push:
    branches:
      - main
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7.0.1
    - run: gh extension install github/gh-actions-lock
    - run: gh actions-lock --verify
      env:
        GH_TOKEN: ${{ github.token }}
    - uses: actions/setup-java@v6.3.0
      with:
        java-version: 21
        distribution: temurin
    - uses: sbt/setup-sbt@v1.5.15
    - run: sbt -v scalafmtSbtCheck
    - run: sbt -v scalafmtCheckAll
    - run: sbt -v Test/compile
