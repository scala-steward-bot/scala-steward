on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: '5 2 * * *'
concurrency: self-update
jobs:
  scala-steward:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ github.repository_owner == 'scala-steward-bot' }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        java-version: 21
        distribution: temurin
    - uses: sbt/setup-sbt@b113b960ba361e87e08ce02a390d51871b7ee459 # v1.5.13
    - id: generate_token
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      with:
        client-id: 89536
        private-key: ${{ secrets.XUWEI_K_BOT_KEY }}
    - uses: coursier/coursier-setup@d5a17f9aaeb260f9ba336a5b582fb49f79c64ac4 # v3.1.0
    - run: cs install scalafmt
    - run: cs install scalafix
    - run: GITHUB_TOKEN="${{ steps.generate_token.outputs.token }}" sbt -v selfUpdate
