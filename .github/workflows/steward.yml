on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: '10 */2 * * *'
concurrency: steward
jobs:
  scala-steward:
    strategy:
      fail-fast: false
      matrix:
        index: [0, 1, 2]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: ${{ github.repository_owner == 'scala-steward-bot' }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        java-version: 21
        distribution: temurin
    - uses: sbt/setup-sbt@ecad189dd245444b9ae0a0cd5922fd938b88906f # v1.5.12
    - run: echo "${{ secrets.APP_PRIVATE_KEY }}" > key.pem
    - run: sbt
           -v
           --server
           "runMain scala_steward_bot.GetReposFromGitHubApp ${{ matrix.index }} 3"
    - run: rm key.pem
    - run: git diff
    - run: cat repos.md
    - uses: scala-steward-org/scala-steward-action@3e5cae868160200afda12b57c150e56cede989ab # v2.97.0
      env:
        JAVA_OPTS: "-Xmx5G"
      with:
        cache-ttl: "0s"
        author-email: "2517319+scala-steward-bot@users.noreply.github.com"
        author-name: "scala-steward-bot"
        github-token: ${{ secrets.MY_GITHUB_TOKEN }}
        repos-file: "repos.md"
        do-not-fork: "false"
